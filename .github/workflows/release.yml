name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset=WindowMark-$version-win-x64.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish self-contained single file
        run: dotnet publish WindowMark.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Rename artifact
        shell: pwsh
        run: Move-Item publish/WindowMark.exe "publish/${{ steps.version.outputs.asset }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: WindowMark ${{ github.ref_name }}
          files: publish/${{ steps.version.outputs.asset }}
          generate_release_notes: true
          fail_on_unmatched_files: true
